version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: jobsquare_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: jobsquaremadb

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobsquare_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: jobsquaremadb
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_HOME: /cache/huggingface 
    depends_on:
      - mongo
    volumes:
      - ./backend/uploads:/app/uploads
      - hf_model_cache:/cache/huggingface 

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobsquare_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  hf_model_cache: